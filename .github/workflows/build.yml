name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: promodo-linux
            add_data: "styles:styles"
            output: dist/promodo
          - os: windows-latest
            artifact: promodo-windows
            add_data: "styles;styles"
            output: dist/promodo.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: >
          pyinstaller --onefile --name promodo
          --collect-all textual
          --collect-all rich
          --collect-all themes
          --add-data "${{ matrix.add_data }}"
          main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}